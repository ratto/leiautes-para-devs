<svg viewBox="0 0 640 380" width="640" height="380" xmlns="http://www.w3.org/2000/svg">
  <title>Evolução de custo de IA por tipo de relatório</title>
  <rect width="640" height="380" fill="#ffffff"/>
  <text x="320" y="24" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f2933">Evolução de Custo de IA por Sprint (BRL)</text>

  <!-- gridlines -->
  <g stroke="#e4e9ee" stroke-width="1">
    <line x1="60" y1="40" x2="600" y2="40"/>
    <line x1="60" y1="92" x2="600" y2="92"/>
    <line x1="60" y1="144" x2="600" y2="144"/>
    <line x1="60" y1="196" x2="600" y2="196"/>
    <line x1="60" y1="248" x2="600" y2="248"/>
  </g>
  <g font-family="sans-serif" font-size="11" fill="#52606d" text-anchor="end">
    <text x="54" y="44">R$25</text>
    <text x="54" y="96">R$20</text>
    <text x="54" y="148">R$15</text>
    <text x="54" y="200">R$10</text>
    <text x="54" y="252">R$5</text>
  </g>

  <line x1="60" y1="40" x2="60" y2="300" stroke="#8b98a5"/>
  <line x1="60" y1="300" x2="600" y2="300" stroke="#8b98a5"/>
  <text x="330" y="300" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2933" dy="20">Sprint 1</text>

  <!-- single-point series (primeira Sprint revisada — sem histórico anterior) -->
  <circle cx="330" cy="71.5" r="4" fill="#2f6fed"/>
  <text x="342" y="75" font-family="sans-serif" font-size="11" fill="#2f6fed">dev — R$21,97</text>

  <circle cx="330" cy="182.4" r="4" fill="#6b7684"/>
  <text x="342" y="186" font-family="sans-serif" font-size="11" fill="#6b7684">sprint-plan — R$11,31</text>

  <circle cx="330" cy="188.7" r="4" fill="#20a37c"/>
  <text x="342" y="205" font-family="sans-serif" font-size="11" fill="#20a37c">qa — R$10,70</text>

  <circle cx="330" cy="222.7" r="4" fill="#e0a62e"/>
  <text x="342" y="226" font-family="sans-serif" font-size="11" fill="#e0a62e">refine-us — R$7,43</text>

  <circle cx="330" cy="245.6" r="4" fill="#a35ee0"/>
  <text x="342" y="249" font-family="sans-serif" font-size="11" fill="#a35ee0">tech-lead — R$5,23</text>

  <text x="320" y="335" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#8b98a5">Sprint 1 é o primeiro review — a partir da Sprint 2, cada tipo de relatório vira uma linha conectando os pontos.</text>
  <text x="320" y="352" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#8b98a5">garbage-collector: sem dados nesta Sprint (roda apenas em Sprints pares).</text>
</svg>
