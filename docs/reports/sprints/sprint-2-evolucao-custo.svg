<svg viewBox="0 0 680 380" width="680" height="380" xmlns="http://www.w3.org/2000/svg">
  <title>Evolução de Custo de IA por Sprint</title>
  <rect width="680" height="380" fill="#ffffff"/>
  <text x="300" y="26" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1f2933">Evolução de Custo de IA por Sprint (BRL)</text>

  <!-- Axes -->
  <line x1="60" y1="40" x2="60" y2="310" stroke="#8b98a5" stroke-width="1"/>
  <line x1="60" y1="310" x2="500" y2="310" stroke="#8b98a5" stroke-width="1"/>

  <!-- Gridlines (scale: 2px per BRL, max=130 BRL at y=40) -->
  <!-- y=310 (0), y=270 (20), y=230 (40), y=190 (60), y=150 (80), y=110 (100), y=70 (120) -->
  <line x1="60" y1="270" x2="500" y2="270" stroke="#e8ecef" stroke-width="1"/>
  <line x1="60" y1="230" x2="500" y2="230" stroke="#e8ecef" stroke-width="1"/>
  <line x1="60" y1="190" x2="500" y2="190" stroke="#e8ecef" stroke-width="1"/>
  <line x1="60" y1="150" x2="500" y2="150" stroke="#e8ecef" stroke-width="1"/>
  <line x1="60" y1="110" x2="500" y2="110" stroke="#e8ecef" stroke-width="1"/>
  <line x1="60" y1="70"  x2="500" y2="70"  stroke="#e8ecef" stroke-width="1"/>

  <!-- Y tick labels -->
  <text x="54" y="314" text-anchor="end" font-family="sans-serif" font-size="11" fill="#6b7684">0</text>
  <text x="54" y="274" text-anchor="end" font-family="sans-serif" font-size="11" fill="#6b7684">20</text>
  <text x="54" y="234" text-anchor="end" font-family="sans-serif" font-size="11" fill="#6b7684">40</text>
  <text x="54" y="194" text-anchor="end" font-family="sans-serif" font-size="11" fill="#6b7684">60</text>
  <text x="54" y="154" text-anchor="end" font-family="sans-serif" font-size="11" fill="#6b7684">80</text>
  <text x="54" y="114" text-anchor="end" font-family="sans-serif" font-size="11" fill="#6b7684">100</text>
  <text x="54" y="74"  text-anchor="end" font-family="sans-serif" font-size="11" fill="#6b7684">120</text>

  <!-- Y axis label -->
  <text x="14" y="175" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6b7684" transform="rotate(-90,14,175)">Custo (R$)</text>

  <!-- X tick labels: Sprint 1 at x=200, Sprint 2 at x=360 -->
  <text x="200" y="326" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2933">Sprint 1</text>
  <text x="360" y="326" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f2933">Sprint 2</text>
  <!-- Vertical tick marks -->
  <line x1="200" y1="310" x2="200" y2="315" stroke="#8b98a5"/>
  <line x1="360" y1="310" x2="360" y2="315" stroke="#8b98a5"/>

  <!-- ============================================================ -->
  <!-- dev: Sprint1=21.97→y=266, Sprint2=14.80→y=280 -->
  <!-- y = 310 - value*2 -->
  <!-- dev Sprint1: y=310-43.94=266 | Sprint2: y=310-29.60=280 -->
  <polyline points="200,266 360,280" fill="none" stroke="#2f6fed" stroke-width="2"/>
  <circle cx="200" cy="266" r="4" fill="#2f6fed"/>
  <circle cx="360" cy="280" r="4" fill="#2f6fed"/>

  <!-- qa: Sprint1=10.70→y=289, Sprint2=17.15→y=276 -->
  <polyline points="200,289 360,276" fill="none" stroke="#20a37c" stroke-width="2"/>
  <circle cx="200" cy="289" r="4" fill="#20a37c"/>
  <circle cx="360" cy="276" r="4" fill="#20a37c"/>

  <!-- tech-lead: Sprint1=5.23→y=300, Sprint2=120.06→y=70 -->
  <polyline points="200,300 360,70" fill="none" stroke="#a35ee0" stroke-width="2"/>
  <circle cx="200" cy="300" r="4" fill="#a35ee0"/>
  <circle cx="360" cy="70" r="4" fill="#a35ee0"/>
  <!-- annotation for the spike -->
  <text x="365" y="68" font-family="sans-serif" font-size="10" fill="#a35ee0">R$120,06</text>

  <!-- refine-us: Sprint1=7.43→y=295, Sprint2=22.46→y=265 -->
  <polyline points="200,295 360,265" fill="none" stroke="#e0a62e" stroke-width="2"/>
  <circle cx="200" cy="295" r="4" fill="#e0a62e"/>
  <circle cx="360" cy="265" r="4" fill="#e0a62e"/>

  <!-- sprint-plan: Sprint1=11.31→y=287, Sprint2=8.25→y=294 -->
  <polyline points="200,287 360,294" fill="none" stroke="#6b7684" stroke-width="2"/>
  <circle cx="200" cy="287" r="4" fill="#6b7684"/>
  <circle cx="360" cy="294" r="4" fill="#6b7684"/>

  <!-- garbage-collector: only Sprint2=2.09→y=306 (no Sprint1 data — ímpar) -->
  <circle cx="360" cy="306" r="4" fill="#e05d5d"/>

  <!-- ============================================================ -->
  <!-- Legend -->
  <g font-family="sans-serif" font-size="12" fill="#1f2933">
    <text x="520" y="60" font-weight="bold">Legenda</text>
    <rect x="520" y="70" width="12" height="3" fill="#2f6fed"/>
    <circle cx="526" cy="71" r="3" fill="#2f6fed"/>
    <text x="538" y="75">dev</text>

    <rect x="520" y="90" width="12" height="3" fill="#20a37c"/>
    <circle cx="526" cy="91" r="3" fill="#20a37c"/>
    <text x="538" y="95">qa</text>

    <rect x="520" y="110" width="12" height="3" fill="#a35ee0"/>
    <circle cx="526" cy="111" r="3" fill="#a35ee0"/>
    <text x="538" y="115">tech-lead</text>

    <rect x="520" y="130" width="12" height="3" fill="#e0a62e"/>
    <circle cx="526" cy="131" r="3" fill="#e0a62e"/>
    <text x="538" y="135">refine-us</text>

    <rect x="520" y="150" width="12" height="3" fill="#6b7684"/>
    <circle cx="526" cy="151" r="3" fill="#6b7684"/>
    <text x="538" y="155">sprint-plan</text>

    <circle cx="526" cy="171" r="3" fill="#e05d5d"/>
    <text x="538" y="175">gc (par)</text>
  </g>

  <!-- Footer -->
  <text x="300" y="365" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#8b98a5">2 Sprints | Leiautes Para Devs | 07/09/2026</text>
</svg>
